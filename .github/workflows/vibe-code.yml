name: vibe-code

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    # Cheap pre-filter only — the real authorization check (author_association)
    # happens in src/trigger.ts, since this job condition alone cannot be
    # trusted as the security boundary on a public repo.
    if: >
      startsWith(github.event.comment.body, '/vibe-code') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: |
          git config user.name "vibe-coding-bot"
          git config user.email "vibe-coding-bot@users.noreply.github.com"

      - run: npm run ci
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
